[project]
name = "haute-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ralph", email = "ralph@pricing-frontier.co.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "haute>=0.5.0",
]

[project.scripts]
haute-playground = "haute_playground:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["haute.*", "catboost.*", "xgboost.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true
