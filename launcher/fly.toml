# The playground launcher: hands each visitor a session machine from the pool in
# pricing-frontier-playground and proxies the session's traffic to it. Deploy from
# this folder as one machine, since it holds the claims in progress:
#
#   fly deploy --ha=false
app = "pricing-frontier-launcher"
primary_region = "lhr"

[env]
  SESSIONS_APP = "pricing-frontier-playground"
  SESSION_IMAGE = "ghcr.io/pricingfrontier/haute-playground:latest"
  SESSION_DOMAIN = "play.pricing-frontier.co.uk"
  SESSION_REGION = "lhr"
  SESSION_CPU_KIND = "shared"
  SESSION_CPUS = "4"
  SESSION_MEMORY_MB = "2048"
  SESSION_MINUTES = "30"
  # Sessions waiting for visitors: running ones hand over at once, paused ones in about 2 s
  POOL_RUNNING = "1"
  POOL_SUSPENDED = "3"
  # Visitors at once, and per address (an office shares one)
  MAX_SESSIONS = "20"
  MAX_SESSIONS_PER_IP = "3"
  PLAYGROUND_PAGE = "https://pricing-frontier.co.uk/playground.html"
  ALLOWED_ORIGINS = "https://pricing-frontier.co.uk,https://www.pricing-frontier.co.uk"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every visitor holds a WebSocket open through the launcher
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
